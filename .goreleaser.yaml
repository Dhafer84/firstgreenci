# How a release of FirstGreen CI is built and published.
#
# Triggered by pushing a tag: see .github/workflows/release.yml.
# Everything here can be exercised locally, without publishing anything:
#
#   goreleaser check
#   goreleaser release --snapshot --clean

version: 2

project_name: firstgreenci

# Declaring the variable with an empty default lets the templates below read
# it even when nobody set it, instead of failing on an unknown key.
env:
  - HOMEBREW_TAP_TOKEN={{ if index .Env "HOMEBREW_TAP_TOKEN" }}{{ .Env.HOMEBREW_TAP_TOKEN }}{{ end }}

before:
  hooks:
    # Never publish something that does not pass its own tests.
    - go test ./...

builds:
  - id: firstgreenci
    main: ./cmd/firstgreenci
    binary: firstgreenci
    env:
      # The tool uses nothing but the standard library, so the binaries are
      # static and depend on no system library.
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # -s -w drop the debug tables, which halves the size. The -X flag is
      # what puts the released version into the binary; a hand-built one
      # keeps reporting "dev".
      - -s -w -X github.com/Dhafer84/firstgreenci/internal/cli.Version={{ .Version }}

archives:
  - id: firstgreenci
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # The names say what a person would say. "darwin" and "amd64" mean
    # nothing to the beginners this tool is for, and design principle 1 asks
    # for no unexplained jargon in what they read.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else if eq .Os "windows" }}Windows
      {{- else }}Linux{{ end }}_
      {{- if and (eq .Os "darwin") (eq .Arch "arm64") }}AppleSilicon
      {{- else if and (eq .Os "darwin") (eq .Arch "amd64") }}Intel
      {{- else if eq .Arch "arm64" }}ARM64
      {{- else }}x86-64{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "

# Installation through Homebrew, published into a tap of its own.
#
# A cask rather than a formula: GoReleaser deprecated the formula form, and
# Homebrew itself now wants pre-built binaries distributed as casks. The
# trade-off is that casks only install on macOS — Linux users take the
# archive or go install — and that Homebrew marks what a cask installs as
# quarantined. Our binaries are not signed, so Gatekeeper would refuse to run
# them; the hook below removes that mark at install time.
homebrew_casks:
  - name: firstgreenci
    # Writing into a second repository needs a token of its own. The one
    # GitHub Actions provides reaches only the repository it runs in.
    repository:
      owner: Dhafer84
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/Dhafer84/firstgreenci
    description: Takes your project to its first green CI pipeline, without writing any YAML
    # Without a token the cask is simply not published, and the binaries go
    # out all the same. A tag pushed before the token exists must not take
    # the whole release down with it.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    binaries:
      - firstgreenci
    dependencies:
      # act runs the pipeline locally, so Homebrew installs it for the user.
      #
      # Docker is deliberately left out, although a cask could depend on it:
      # it would force Docker Desktop, and its licence terms, on people who
      # already run Colima, OrbStack or Rancher. The caveats say what to do
      # instead.
      - formula: act
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/firstgreenci"]
    caveats: |
      Docker doit être installé et démarré :
        https://www.docker.com/products/docker-desktop/
      Vérifiez que tout est prêt :  firstgreenci doctor

      Docker must be installed and running:
        https://www.docker.com/products/docker-desktop/
      Check that everything is ready:  firstgreenci doctor

# Installation through Scoop, on Windows.
#
# The manifest goes into the very repository that holds the Homebrew cask.
# The name of that repository says "homebrew", which is odd for a Windows
# user, but it means no second repository and no second token: the one in
# place already writes there. The README warns about the name.
scoops:
  - name: firstgreenci
    repository:
      owner: Dhafer84
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: bucket
    homepage: https://github.com/Dhafer84/firstgreenci
    description: Takes your project to its first green CI pipeline, without writing any YAML
    license: MIT
    # Same guard as the cask: with no token the manifest is skipped and the
    # binaries are published all the same.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    depends:
      # act lives in Scoop's main bucket, which is added by default, so this
      # resolves without the user adding anything. Checked against
      # ScoopInstaller/Main before relying on it.
      - act

release:
  draft: false
  prerelease: false
  footer: |
    ## Installation

    Téléchargez le fichier correspondant à votre machine, puis placez
    `firstgreenci` dans un dossier de votre `PATH`.

    **macOS** — téléchargez avec `curl` plutôt qu'avec le navigateur : un
    fichier téléchargé par le navigateur est mis en quarantaine par macOS et
    refusera de se lancer. Si cela vous arrive :
    `xattr -d com.apple.quarantine firstgreenci`

    **Windows** — SmartScreen peut avertir à la première exécution : les
    exécutables ne sont pas signés.

    Vérifiez ce que vous avez téléchargé avec `checksums.txt`.

    ---

    ## Installation (English)

    Download the file matching your machine, then put `firstgreenci` in a
    folder on your `PATH`.

    **macOS** — download with `curl` rather than the browser: a
    browser-downloaded file is quarantined by macOS and will refuse to run.
    If that happens: `xattr -d com.apple.quarantine firstgreenci`

    **Windows** — SmartScreen may warn on first run: the executables are not
    signed.

    Check what you downloaded against `checksums.txt`.
