name: "Automated checks"

# When to run these checks: on every push, and on every proposed change.
on:
  push:
  pull_request:

jobs:
  test:
    # The machine that runs the checks, provided by GitHub.
    runs-on: ubuntu-latest

    steps:
      # Copies your project onto the machine that runs the checks.
      - name: "Get the code"
        uses: actions/checkout@v4

      # Installs the same version of Python as the one on your computer.
      - name: "Install Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs the libraries your project needs.
      - name: "Install the dependencies"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Runs your tests. If one of them fails, the check turns red.
      - name: "Run the tests"
        run: |
          pytest
